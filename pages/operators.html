<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TSW Hud - Operators</title>
<link rel="stylesheet" href="/pages/style.css">
<script src="/pages/theme.js"></script>
<style>
  main { max-width: none; padding: 8px; padding-top: 10px; }

  .groups-container { display: flex; flex-direction: column; gap: 12px; }
  .trains-grid { display: flex; flex-direction: column; gap: 10px; }
  .op-item { display: flex; flex-direction: column; }

  .pill-wrap {
    position: relative;
    padding: 4px 16px 4px 4px;
    border: 4px solid rgba(255,255,255,0.13);
    border-radius: 20px;
    overflow: hidden;
  }

  .pill-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: var(--livery-color);
    -webkit-mask-image: linear-gradient(to left, #000 0, #000 60px, transparent 156px);
            mask-image: linear-gradient(to left, #000 0, #000 60px, transparent 156px);
    pointer-events: none;
  }

  /* Inner pill body: tinted with the operator colour at 20% opacity. */
  .train-pill {
    background: color-mix(in srgb, var(--livery-color) 20%, transparent);
    border-radius: 8px 20px 20px 8px;
    height: 156px;
    display: flex; align-items: stretch;
    position: relative; z-index: 1;
    overflow: hidden;
    cursor: pointer;
  }
  .train-pill:hover { background: color-mix(in srgb, var(--livery-color) 28%, transparent); }

  /* Logo flush to the right edge; corners clipped by .train-pill's radius,
     revealing the coloured frame behind. */
  .op-logo-pill {
    width: 156px; height: 156px; flex-shrink: 0; overflow: hidden;
    background: #1c1a20;
    display: flex; align-items: center; justify-content: center;
    margin-left: auto;
  }
  .op-logo-pill img { width: 100%; height: 100%; object-fit: contain; }
  .op-logo-pill span { font-size: 15px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }

  .train-pill-content { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 16px; align-items: flex-start; }
  .train-pill-name { font-weight: 600; font-size: 26px; color: var(--text); word-wrap: break-word; line-height: 1.2; }
  .train-pill-meta { font-size: 13px; color: var(--text-dim); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .train-pill-actions { display: flex; gap: 6px; align-self: flex-end; }

  .edit-btn { background: transparent; border: 1px solid var(--hairline); color: var(--text); padding: 5px 14px; border-radius: 6px; font-size: 12.5px; cursor: pointer; text-decoration: none; display: inline-block; }
  .edit-btn:hover { border-color: var(--accent); color: var(--accent-bright); }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .toolbar label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .toolbar button { background: transparent; border: 1px solid var(--hairline); color: var(--text); padding: 5px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
  .toolbar button:hover { border-color: var(--accent); color: var(--accent-bright); }

  .op-expanded-content { padding: 12px 12px 0; border-top: 1px solid var(--hairline); background: rgba(255,255,255,0.02); }
  .livery-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--hairline); border-radius: 5px; margin-bottom: 6px; }
  .livery-swatch { width: 18px; height: 18px; border-radius: 3px; border: 1px solid var(--hairline); flex-shrink: 0; }
  .livery-logo { width: 32px; height: 32px; border-radius: 4px; background: #1c1a20; border: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
  .livery-logo img { width: 100%; height: 100%; object-fit: contain; }
  .livery-logo span { font-size: 8px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }
  .livery-name { flex: 1; font-size: 13px; font-weight: 600; }
  .livery-code { font-size: 11px; color: var(--text-dim); font-family: monospace; }
  .livery-default { font-size: 10px; color: var(--accent-bright); border: 1px solid var(--accent); border-radius: 10px; padding: 1px 7px; }
  .del-btn { background: transparent; border: 1px solid rgba(224,90,78,0.4); color: var(--status-red); padding: 3px 9px; border-radius: 4px; font-size: 11px; cursor: pointer; }
  .del-btn:hover { background: rgba(224,90,78,0.15); }
  .edit-sm-btn { background: transparent; border: 1px solid var(--hairline); color: var(--text-dim); padding: 3px 9px; border-radius: 4px; font-size: 11px; cursor: pointer; }
  .edit-sm-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .livery-edit-form { display: none; padding: 10px 12px; background: rgba(255,255,255,0.03); border-top: 1px solid var(--hairline); gap: 8px; flex-direction: column; }
  .livery-edit-form.open { display: flex; }
  .livery-edit-form .field-row { margin-top: 0; flex-wrap: wrap; }
  .livery-edit-form input[type=text] { flex: 1; min-width: 100px; }
  .livery-edit-form .save-btn { background: var(--accent); color: #1a1013; border: none; padding: 4px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; font-family: var(--heading); font-weight: 700; }

  .op-edit-form { display: none; padding: 12px 12px 0; border: 2px solid rgba(255,255,255,0.13); border-top: none; border-radius: 0 0 14px 14px; background: rgba(255,255,255,0.02); gap: 10px; flex-direction: column; }
  .op-edit-form.open { display: flex; }
  .op-edit-form input { padding: 6px 8px; background: rgba(255,255,255,0.06); border: 1px solid var(--hairline); border-radius: 4px; color: var(--text); font-family: var(--sans); font-size: 13px; }
  .op-edit-form label { font-size: 12px; color: var(--text-dim); font-family: var(--heading); }
  .op-form-row { display: flex; gap: 10px; align-items: flex-end; }
  .op-form-row input { flex: 1; }
  .op-form-row button { padding: 6px 14px; font-size: 12px; }
  .op-add-form { padding: 12px; border-top: 1px solid var(--hairline); background: rgba(255,255,255,0.02); }
  .op-add-form h4 { font-family: var(--heading); font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); margin: 0 0 10px; }
  .op-add-form .field-row { display: flex; gap: 8px; align-items: flex-end; }
  .op-add-form input { flex: 1; padding: 6px 8px; background: rgba(255,255,255,0.06); border: 1px solid var(--hairline); border-radius: 4px; color: var(--text); font-family: var(--sans); font-size: 13px; }
  .op-add-form button { padding: 6px 14px; font-size: 12px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><strong>TSW Hud</strong> · operators</div>
    <div class="nav" id="navContainer"></div>
    <button class="exit-btn" onclick="exitApp()">Exit</button>
  </div>

  <main>
    <div class="panel">
      <h2>Operators</h2>
      <p class="small dim">
        Manage train operators, their liveries, and associated images. Livery images load from
        <span style="font-family: monospace;">company_logos/{livery_code}.png</span>.
      </p>
      <div class="toolbar">
        <button onclick="location.href='/pages/known_trains.html'">← Known Trains</button>
        <button onclick="location.href='/pages/groups.html'">Groups</button>
      </div>
    </div>

    <div class="panel">
      <h2>All operators</h2>
      <div class="groups-container" id="operatorsList"></div>
      <p class="small dim" id="emptyState" style="display:none; text-align:center; margin-top:20px;">
        No operators yet — create one below.
      </p>
    </div>

    <div class="panel">
      <h2>Add operator</h2>
      <form onsubmit="createOperator(event)" class="op-add-form">
        <div class="field-row">
          <input type="text" id="new-op-name" placeholder="e.g. ScotRail" required>
          <input type="text" id="new-op-code" placeholder="Short code (e.g. ScR)">
          <button type="submit" class="btn primary">Add</button>
        </div>
      </form>
    </div>
  </main>

<script>
let operators = [];

async function load() {
  try {
    const res = await fetch('/api/operators');
    const data = await res.json();
    operators = data.operators || [];
    render();
  } catch(e) {
    document.getElementById('operatorsList').innerHTML = '<p class="small dim">Could not load operators.</p>';
  }
}

function logoHtml(op) {
  if (!op.short_code) return `<span>${esc(op.name.substring(0,3).toUpperCase())}</span>`;
  const fallback = esc(op.short_code.substring(0,3).toUpperCase());
  return `<img src="/company_logos/${esc(op.short_code)}.png" alt="${esc(op.name)}" onerror="this.parentElement.innerHTML='<span>${fallback}</span>'">`;
}

function liveryLogoHtml(liv) {
  const code = (liv.code || '').trim();
  if (!code) return `<span>${esc(liv.name.substring(0,3).toUpperCase())}</span>`;
  const fallback = esc(code.substring(0,4).toUpperCase());
  return `<img src="/company_logos/${esc(code)}.png" alt="${esc(code)}" onerror="this.parentElement.innerHTML='<span>${fallback}</span>'">`;
}

function render() {
  const container = document.getElementById('operatorsList');
  if (!operators.length) {
    document.getElementById('emptyState').style.display = 'block';
    container.innerHTML = '';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';
  container.innerHTML = `<div class="trains-grid">${operators.map(op => `
    <div class="op-item">
      <div class="pill-wrap" style="--livery-color: ${op.colour || '#a06bf0'};">
        <div class="train-pill" id="op-pill-${op.id}">
          <div class="train-pill-content" onclick="toggleOp(${op.id})">
            <div>
              <div class="train-pill-name">${esc(op.name)}</div>
              <div class="train-pill-meta">${op.short_code || '(no code)'}</div>
            </div>
          </div>
          <div class="train-pill-actions">
            <button class="edit-btn" onclick="event.stopPropagation(); toggleEdit(${op.id})">Edit</button>
            <button class="del-btn" onclick="event.stopPropagation(); deleteOperator(${op.id}, '${esc(op.name)}')">Delete</button>
          </div>
          <div class="op-logo-pill">${logoHtml(op)}</div>
        </div>
      </div>
      <div class="op-edit-form" id="op-edit-${op.id}">
        <label>Operator name</label>
        <input type="text" id="opname-${op.id}" value="${esc(op.name)}" required>
        <label>Short code</label>
        <input type="text" id="opcode-${op.id}" value="${esc(op.short_code || '')}" placeholder="e.g. ScR">
        <label>Colour (used on pill and as default for new liveries)</label>
        <div style="display:flex;gap:8px;">
          <input type="color" id="opcolour-picker-${op.id}" value="${op.colour || '#a06bf0'}" oninput="document.getElementById('opcolour-${op.id}').value=this.value" style="width:36px;height:32px;padding:2px;border-radius:4px;border:1px solid var(--hairline);background:transparent;cursor:pointer;">
          <input type="text" id="opcolour-${op.id}" value="${op.colour || '#a06bf0'}" placeholder="#a06bf0" oninput="document.getElementById('opcolour-picker-${op.id}').value=this.value" style="flex:1;">
        </div>
        <div class="op-form-row">
          <button type="button" class="btn primary" onclick="saveOperator(${op.id})">Save</button>
          <button type="button" class="edit-btn" onclick="toggleEdit(${op.id})">Cancel</button>
        </div>
      </div>
      <div class="op-expanded-content" id="op-expand-${op.id}" style="display:none;">
        <div style="margin-bottom:14px;">
          <h4 style="font-family:var(--heading);font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin:0 0 10px;">Liveries</h4>
          <div id="liveries-${op.id}">Loading…</div>
        </div>
        <div style="border-top:1px solid var(--hairline);padding-top:14px;">
          <h4 style="font-family:var(--heading);font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin:0 0 10px;">Add livery</h4>
          <form onsubmit="addLivery(event, ${op.id})">
            <label>Livery name</label>
            <input type="text" id="lname-${op.id}" placeholder="e.g. ScotRail Saltire" required style="width:100%;margin-bottom:8px;">
            <label>Code (for photo lookup)</label>
            <input type="text" id="lcode-${op.id}" placeholder="e.g. ScR" required style="width:100%;margin-bottom:8px;">
            <label>Colour</label>
            <div style="display:flex;gap:8px;margin-bottom:10px;">
              <input type="color" id="lcolour-picker-${op.id}" value="${op.colour || '#a06bf0'}" oninput="document.getElementById('lcolour-${op.id}').value=this.value" style="width:36px;height:32px;padding:2px;border-radius:4px;border:1px solid var(--hairline);background:transparent;cursor:pointer;">
              <input type="text" id="lcolour-${op.id}" value="${op.colour || '#a06bf0'}" placeholder="#a06bf0" oninput="document.getElementById('lcolour-picker-${op.id}').value=this.value" style="flex:1;">
            </div>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);margin-bottom:10px;"><input type="checkbox" id="ldefault-${op.id}"> Set as default</label>
            <button type="submit" class="btn primary">Add Livery</button>
          </form>
        </div>
      </div>
    </div>
  `).join('')}</div>`;
  operators.forEach(op => loadLiveries(op.id));
}

function renderLiveries(operatorId, liveries) {
  const container = document.getElementById(`liveries-${operatorId}`);
  if (!liveries.length) { container.innerHTML = '<p class="small dim">No liveries yet — add one below.</p>'; return; }
  container.innerHTML = liveries.map(liv => `
    <div id="livery-wrap-${liv.id}">
      <div class="livery-item" id="livery-item-${liv.id}">
        <div class="livery-logo">${liveryLogoHtml(liv)}</div>
        <div class="livery-swatch" style="background:${liv.colour || 'var(--hairline)'}"></div>
        <span class="livery-name">${esc(liv.name)}</span>
        <span class="livery-code">${esc(liv.code)}</span>
        ${liv.is_default ? '<span class="livery-default">Default</span>' : `<button class="del-btn" style="font-size:10px;padding:2px 7px;" onclick="setDefault(${liv.id}, ${operatorId})">Set default</button>`}
        <button class="edit-sm-btn" onclick="toggleLiveryEdit(${liv.id})">Edit</button>
        <button class="del-btn" onclick="deleteLivery(${liv.id}, '${esc(liv.name)}', ${operatorId})">Remove</button>
      </div>
      <div class="livery-edit-form" id="livery-edit-${liv.id}">
        <div class="field-row">
          <input type="text" id="ledit-name-${liv.id}" value="${esc(liv.name)}" placeholder="Livery name" style="flex:2;">
          <input type="text" id="ledit-code-${liv.id}" value="${esc(liv.code)}" placeholder="Code e.g. ScR" style="max-width:90px;">
          <input type="color" id="ledit-colour-picker-${liv.id}" value="${liv.colour || '#a06bf0'}" oninput="document.getElementById('ledit-colour-${liv.id}').value=this.value" style="width:36px;height:32px;padding:2px;border-radius:4px;border:1px solid var(--hairline);background:transparent;cursor:pointer;">
          <input type="text" id="ledit-colour-${liv.id}" value="${liv.colour || '#a06bf0'}" placeholder="#a06bf0" style="max-width:90px;" oninput="document.getElementById('ledit-colour-picker-${liv.id}').value=this.value">
          <button class="save-btn" onclick="saveLivery(${liv.id}, ${operatorId})">Save</button>
        </div>
        <p class="small dim" style="margin:8px 0 0;">Image: place <span style="font-family:monospace;">${esc(liv.code)}.png</span> in <span style="font-family:monospace;">company_logos/</span></p>
      </div>
    </div>
  `).join('');
}

function toggleOp(opId) {
  const expand = document.getElementById(`op-expand-${opId}`);
  expand.style.display = expand.style.display === 'none' ? 'block' : 'none';
}

function toggleEdit(opId) {
  document.getElementById(`op-edit-${opId}`).classList.toggle('open');
}

function toggleLiveryEdit(liveryId) {
  document.getElementById(`livery-edit-${liveryId}`).classList.toggle('open');
}

async function loadLiveries(operatorId) {
  try {
    const res = await fetch(`/api/operators/${operatorId}/liveries`);
    const data = await res.json();
    renderLiveries(operatorId, data.liveries || []);
    // Set the pill's livery color to the default livery's colour
    const defaultLivery = (data.liveries || []).find(l => l.is_default);
    if (defaultLivery && defaultLivery.colour) {
      const pill = document.getElementById(`op-pill-${operatorId}`);
      if (pill) pill.style.setProperty('--livery-color', defaultLivery.colour);
    }
  } catch(e) {}
}

async function saveOperator(operatorId) {
  const name = document.getElementById(`opname-${operatorId}`).value.trim();
  const code = document.getElementById(`opcode-${operatorId}`).value.trim();
  const colour = document.getElementById(`opcolour-${operatorId}`).value.trim();
  try {
    await fetch(`/api/operators/${operatorId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, short_code: code || null, colour })
    });
    await load();
  } catch(e) { alert('Save failed'); }
}

async function createOperator(e) {
  e.preventDefault();
  const name = document.getElementById('new-op-name').value.trim();
  const code = document.getElementById('new-op-code').value.trim();
  try {
    await fetch('/api/operators', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, short_code: code || null })
    });
    document.getElementById('new-op-name').value = '';
    document.getElementById('new-op-code').value = '';
    await load();
  } catch(e) { alert('Create failed'); }
}

async function deleteOperator(operatorId, name) {
  if (!confirm(`Delete operator "${name}"? All associated liveries will also be removed.`)) return;
  try {
    await fetch(`/api/operators/${operatorId}`, { method: 'DELETE' });
    await load();
  } catch(e) { alert('Delete failed'); }
}

async function addLivery(e, operatorId) {
  e.preventDefault();
  const op = operators.find(o => o.id === operatorId);
  const defaultColour = op ? (op.colour || '#a06bf0') : '#a06bf0';
  const name = document.getElementById(`lname-${operatorId}`).value.trim();
  const code = document.getElementById(`lcode-${operatorId}`).value.trim();
  const colour = document.getElementById(`lcolour-${operatorId}`).value.trim();
  const isDefault = document.getElementById(`ldefault-${operatorId}`).checked ? 1 : 0;
  try {
    await fetch(`/api/operators/${operatorId}/liveries`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, code, colour, is_default: isDefault })
    });
    document.getElementById(`lname-${operatorId}`).value = '';
    document.getElementById(`lcode-${operatorId}`).value = '';
    document.getElementById(`lcolour-${operatorId}`).value = defaultColour;
    document.getElementById(`lcolour-picker-${operatorId}`).value = defaultColour;
    document.getElementById(`ldefault-${operatorId}`).checked = false;
    await loadLiveries(operatorId);
  } catch(e) { alert('Add failed'); }
}

async function setDefault(liveryId, operatorId) {
  try {
    await fetch(`/api/operators/liveries/${liveryId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ is_default: 1 })
    });
    await loadLiveries(operatorId);
  } catch(e) { alert('Failed'); }
}

async function saveLivery(liveryId, operatorId) {
  const name = document.getElementById(`ledit-name-${liveryId}`).value.trim();
  const code = document.getElementById(`ledit-code-${liveryId}`).value.trim();
  const colour = document.getElementById(`ledit-colour-${liveryId}`).value.trim();
  if (!name || !code) { alert('Name and code are required'); return; }
  try {
    await fetch(`/api/operators/liveries/${liveryId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, code, colour })
    });
    await loadLiveries(operatorId);
  } catch(e) { alert('Save failed'); }
}

async function deleteLivery(liveryId, name, operatorId) {
  if (!confirm(`Remove livery "${name}"?`)) return;
  try {
    await fetch(`/api/operators/liveries/${liveryId}`, { method: 'DELETE' });
    await loadLiveries(operatorId);
  } catch(e) { alert('Delete failed'); }
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function exitApp() { fetch('/api/shutdown', {method: 'POST'}); }

load();
</script>
<script src="/pages/nav.js"></script>
</body>
</html>
