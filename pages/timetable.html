<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the page draw INTO the notch area. Without
     it a phone reserves a blank band across the top in full screen,
     which is dead space on a HUD. Safe-area insets below then keep
     content clear of the camera cutout itself. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSW Hud - Timetable</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Timetable HUD is its own thing - deliberately NOT pulling in style.css's
     global theme, and NOT sharing any code with the Dashboard HUDs. Changes
     made to the Dashboard HUDs should not affect this page, and vice versa,
     unless specifically asked for on both. */
  :root {
    --text: #f0edf5; --text-dim: #a9a4b3; --dimmer: #6c6875;
    --accent: #b98cff; --accent-bright: #d5b8ff;
    --hairline: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    /* 100dvh, not 100vh: on a phone 100vh is the height with the browser
       chrome VISIBLE, so it overshoots in full screen and leaves the page
       scrollable by exactly the toolbar's height. */
    min-height: 100dvh;
    background: radial-gradient(ellipse at 50% 0%, #16161a 0%, #0a0a0b 60%);
    font-family: 'Barlow', sans-serif; color: var(--text);
  }
  .wrap {
    max-width: 560px; margin: 0 auto;
    /* Top padding follows the device's own safe area rather than a fixed
       22px: a phone in full screen needs only enough to clear the camera
       cutout, and a desktop window needs none of it. */
    padding: max(10px, env(safe-area-inset-top)) 12px 40px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }

  .hud-controls-overlay {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    /* The controls overlay sits ON the notch band, so it takes the inset
       instead of the page - it only appears on tap, and the stop list
       underneath keeps the full height. */
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             12px max(16px, env(safe-area-inset-left));
    background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 20;
  }
  .hud-controls-overlay.visible { opacity: 1; pointer-events: auto; }
  .hud-controls-overlay a.brand {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    letter-spacing: .08em; color: var(--text); text-decoration: none; font-size: 15px;
  }
  .hud-controls-overlay button {
    background: rgba(255,255,255,0.08); border: 1px solid var(--hairline);
    color: var(--text); border-radius: 6px; padding: 5px 11px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px;
    letter-spacing: .06em; cursor: pointer;
  }

  header.service {
    display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap;
    /* Clears the controls overlay, which is 44px tall and only appears on
       tap. Without it the headcode sat directly under the TSW HUD link.
       Applied here rather than to .wrap so the stop list itself is not
       pushed down when the controls are hidden - which is most of the time. */
    padding: 44px 4px 10px; border-bottom: 1px solid var(--hairline); margin-bottom: 2px;
  }
  .headcode {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 30px; letter-spacing: .04em; color: var(--accent-bright);
    line-height: 1;
  }
  .service-meta { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }
  .clock {
    margin-left: auto; font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-variant-numeric: tabular-nums; color: var(--text-dim);
    /* Nudged down clear of the controls overlay, which appears on tap and
       spans the full width - a clock level with it sat under the Exit
       button. margin, not padding: the clock is a flex child and padding
       only grew its box without moving the text. */
    margin-top: 0;
  }

  .call {
    display: grid; grid-template-columns: 78px 1fr auto;
    gap: 12px; align-items: baseline;
    padding: 11px 6px; border-bottom: 1px solid var(--hairline);
  }
  /* Passed calls are dimmed, not removed: seeing where you have been is
     half of reading a timetable. */
  .call.passed { opacity: .38; }
  .call.next {
    background: linear-gradient(90deg, rgba(185,140,255,0.14), transparent 70%);
    border-left: 3px solid var(--accent); padding-left: 9px;
  }
  .call.next .station { color: var(--accent-bright); }

  .times {
    font-family: 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums;
    font-size: 18px; line-height: 1.15;
  }
  .times .arr { color: var(--text-dim); font-size: 13.5px; display: block; }
  .station { font-size: 17px; font-weight: 500; }
  .platform { font-size: 12px; color: var(--dimmer); }
  .away {
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px;
    color: var(--text-dim); white-space: nowrap;
  }
  .away.now { color: var(--accent-bright); }

  .notice {
    padding: 16px 14px; color: var(--text-dim); font-size: 14px;
    border: 1px solid var(--hairline); border-radius: 10px; margin-top: 14px;
    background: rgba(255,255,255,0.02);
  }
  select {
    background: rgba(255,255,255,0.06); color: var(--text);
    border: 1px solid var(--hairline); border-radius: 6px;
    padding: 7px 10px; font-family: 'Barlow', sans-serif; font-size: 13px;
    max-width: 100%;
  }
  .picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .picker button {
    background: rgba(255,255,255,0.08); border: 1px solid var(--hairline);
    color: var(--text); border-radius: 6px; padding: 7px 12px;
    font-family: 'Barlow', sans-serif; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="hud-controls-overlay" id="hud-controls">
    <a class="brand" href="/">TSW HUD</a>
    <div>
      <button onclick="toggleFullScreen()">Full screen</button>
      <button onclick="exitApp()">Exit</button>
    </div>
  </div>

  <div class="wrap">
    <header class="service">
      <div>
        <div class="headcode" id="headcode">&mdash;</div>
        <div class="service-meta" id="serviceMeta">waiting for a service&hellip;</div>
      </div>
      <div class="clock" id="clock"></div>
    </header>

    <div id="calls"></div>
    <div id="notice"></div>
  </div>

<script src="/pages/hud-controls.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toggleFullScreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
function exitApp() { fetch('/api/shutdown', { method: 'POST' }); }

// A hand-picked service overrides the live lookup until cleared, so the page
// is usable for planning when the game is not running.
// ?name=P2K24 or ?service=2K24 pins a service from the URL, so a phone can
// be pointed straight at one without tapping through the picker.
const params = new URLSearchParams(location.search);
let pinned = params.get('name') || params.get('service') || null;
let lastGood = null;
let lastGoodAt = 0;
let routesLoaded = false;

// How long a stop list stays on screen after the game stops naming a
// service. Long enough to ride out a dropped poll or the gap between two
// workings; short enough that it cannot show one service for an entire
// journey in another - which is exactly what happened when it was held
// indefinitely.
const STALE_AFTER_MS = 90000;

function hhmm(t) { return t ? String(t).slice(0, 5) : ''; }

function awayText(c) {
  if (c.passed || c.minutes_away == null) return '';
  if (c.minutes_away <= 0) return 'now';
  if (c.minutes_away < 60) return c.minutes_away + ' min';
  return Math.floor(c.minutes_away / 60) + 'h ' + (c.minutes_away % 60) + 'm';
}

function render(d) {
  const callsBox = document.getElementById('calls');
  const notice = document.getElementById('notice');

  if (!d.found) {
    // Keep the last good timetable briefly rather than blanking it - a
    // dropped poll is not a reason to throw away the stop list someone is
    // reading. But only briefly, and say so, because a held service that
    // never expires reads as the CURRENT one.
    const age = Date.now() - lastGoodAt;
    if (lastGood && age < STALE_AFTER_MS) {
      document.getElementById('serviceMeta').innerHTML =
        `<span style="color:#e8b74a;">waiting for the game &mdash; `
        + `showing ${esc(lastGood.headcode || '')} from `
        + `${Math.round(age / 1000)}s ago</span>`;
      notice.innerHTML = pickerHtml();
      wirePicker();
      return;
    }
    lastGood = null;
    document.getElementById('headcode').textContent = '\u2014';
    document.getElementById('serviceMeta').textContent =
      d.live_error ? 'game not running' : 'no service';
    callsBox.innerHTML = '';
    notice.innerHTML = `<div class="notice">${esc(d.detail
      || 'No timetable for this service yet.')}</div>` + pickerHtml();
    wirePicker();
    return;
  }

  lastGood = d;
  lastGoodAt = Date.now();
  document.getElementById('headcode').textContent =
    d.headcode || d.service_name || '\u2014';
  const parts = [];
  if (d.route_key) parts.push(esc(d.route_key));
  if (d.first_time) parts.push(hhmm(d.first_time) + ' \u2192 ' + hhmm(d.last_time));
  parts.push(d.call_count + ' stops');
  if (d.role === 'ai_continuation') parts.push('AI leg');
  if (pinned) parts.push('picked by hand');
  document.getElementById('serviceMeta').innerHTML = parts.join(' \u00b7 ');

  callsBox.innerHTML = (d.calls || []).map((c, i) => {
    const next = i === d.next_index;
    return `
      <div class="call ${c.passed ? 'passed' : ''} ${next ? 'next' : ''}">
        <div class="times">
          <span>${esc(hhmm(c.departure) || hhmm(c.arrival))}</span>
          ${c.arrival && c.departure
            ? `<span class="arr">arr ${esc(hhmm(c.arrival))}</span>` : ''}
        </div>
        <div>
          <div class="station">${esc(c.station_name || '\u2014')}</div>
          ${c.platform ? `<div class="platform">Platform ${esc(c.platform)}</div>` : ''}
        </div>
        <div class="away ${next ? 'now' : ''}">${esc(awayText(c))}</div>
      </div>`;
  }).join('');
  notice.innerHTML = pickerHtml();
  wirePicker();
}

function pickerHtml() {
  return `<div class="picker">
    <select id="routeSel"><option value="">route&hellip;</option></select>
    <select id="svcSel"><option value="">service&hellip;</option></select>
    ${pinned ? '<button id="unpinBtn">back to live</button>' : ''}
  </div>`;
}

// The picker is rebuilt on every render, so its handlers are attached each
// time rather than inline - inline handlers on regenerated markup were how
// the Known Trains page lost its buttons.
function wirePicker() {
  const routeSel = document.getElementById('routeSel');
  const svcSel = document.getElementById('svcSel');
  const unpin = document.getElementById('unpinBtn');
  if (unpin) unpin.onclick = () => { pinned = null; poll(); };
  if (routeSel) routeSel.onchange = () => loadServices(routeSel.value);
  if (svcSel) svcSel.onchange = () => {
    if (svcSel.value) { pinned = svcSel.value; poll(); }
  };
  if (!routesLoaded) { routesLoaded = true; loadServices(''); }
}

async function loadServices(route) {
  try {
    const d = await (await fetch('/api/timetable/services'
      + (route ? '?route=' + encodeURIComponent(route) : ''))).json();
    const routeSel = document.getElementById('routeSel');
    const svcSel = document.getElementById('svcSel');
    if (routeSel) {
      routeSel.innerHTML = '<option value="">route&hellip;</option>'
        + (d.routes || []).map(r =>
            `<option ${r === route ? 'selected' : ''}>${esc(r)}</option>`).join('');
    }
    if (svcSel) {
      // Only services with calls are offered. Empty stock and continuation
      // legs are real records but have nothing to show on a stop list.
      svcSel.innerHTML = '<option value="">service&hellip;</option>'
        + (d.services || []).filter(s => s.n_calls).map(s =>
            `<option value="${esc(s.service_name || s.headcode)}">`
            + `${esc(hhmm(s.first_time))} ${esc(s.headcode || '')} `
            + `(${s.n_calls} stops)</option>`).join('');
    }
  } catch (e) { /* picker is optional; the live view still works */ }
}

async function poll() {
  try {
    const url = pinned
      ? '/api/timetable/live?name=' + encodeURIComponent(pinned)
      : '/api/timetable/live';
    render(await (await fetch(url)).json());
  } catch (e) {
    // leave whatever is on screen
  }
}

function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2, '0') + ':' +
    String(now.getMinutes()).padStart(2, '0');
}

initHudControls('hud-controls');
tick();
poll();
setInterval(tick, 1000);
// The booked timetable does not change; only our position through it does,
// so a slow poll is plenty and keeps the load off the game.
setInterval(poll, 5000);
</script>
</body>
</html>
