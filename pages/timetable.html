<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the page draw INTO the notch area. Without
     it a phone reserves a blank band across the top in full screen,
     which is dead space on a HUD. Safe-area insets below then keep
     content clear of the camera cutout itself. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSW Hud - Timetable</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Timetable HUD is its own thing - deliberately NOT pulling in style.css's
     global theme, and NOT sharing any code with the Dashboard HUDs. Changes
     made to the Dashboard HUDs should not affect this page, and vice versa,
     unless specifically asked for on both. */
  :root {
    --text: #f0edf5; --text-dim: #a9a4b3; --dimmer: #6c6875;
    --accent: #b98cff; --accent-bright: #d5b8ff;
    --hairline: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    /* 100dvh, not 100vh: on a phone 100vh is the height with the browser
       chrome VISIBLE, so it overshoots in full screen and leaves the page
       scrollable by exactly the toolbar's height. */
    min-height: 100dvh;
    background: radial-gradient(ellipse at 50% 0%, #16161a 0%, #0a0a0b 60%);
    font-family: 'Barlow', sans-serif; color: var(--text);
  }
  .wrap {
    max-width: 560px; margin: 0 auto;
    /* Top padding follows the device's own safe area rather than a fixed
       22px: a phone in full screen needs only enough to clear the camera
       cutout, and a desktop window needs none of it. */
    /* Only the device's own inset - no arbitrary minimum. On a phone this
       is the cutout clearance and nothing more; on a desktop it is zero. */
    padding: env(safe-area-inset-top) 12px 40px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }

  .hud-controls-overlay {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    /* The controls overlay sits ON the notch band, so it takes the inset
       instead of the page - it only appears on tap, and the stop list
       underneath keeps the full height. */
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             12px max(16px, env(safe-area-inset-left));
    background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 20;
  }
  .hud-controls-overlay.visible { opacity: 1; pointer-events: auto; }
  .hud-controls-overlay a.brand {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    letter-spacing: .08em; color: var(--text); text-decoration: none; font-size: 15px;
  }
  .hud-controls-overlay button {
    background: rgba(255,255,255,0.08); border: 1px solid var(--hairline);
    color: var(--text); border-radius: 6px; padding: 5px 11px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px;
    letter-spacing: .06em; cursor: pointer;
  }

  header.service {
    display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap;
    /* NO top padding. 44px was added to clear the controls overlay and made
       the gap worse than the one it was meant to fix - the overlay only
       appears on tap and fades again, so reserving permanent space for it
       costs a stop off the bottom of the list on every phone, all the time,
       to tidy something visible for two seconds. */
    padding: 0 4px 10px; border-bottom: 1px solid var(--hairline); margin-bottom: 2px;
  }
  .headcode {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 30px; letter-spacing: .04em; color: var(--accent-bright);
    line-height: 1;
  }
  .service-meta { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }
  .clock {
    margin-left: auto; font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-variant-numeric: tabular-nums; color: var(--text-dim);
  }

  /* The header does NOT move for the controls overlay. Two attempts to make
     room for it both made the reported gap worse - a fixed 44px, then 40px
     while visible, which fires on load because the controls show briefly at
     startup. The overlay is translucent, appears on tap and fades; a couple
     of seconds of overlap costs nothing, while permanent space costs a stop
     off the bottom of every phone screen. */

  .call {
    display: grid; grid-template-columns: 78px 1fr auto;
    gap: 12px; align-items: baseline;
    padding: 11px 6px; border-bottom: 1px solid var(--hairline);
  }
  /* Passed calls are dimmed, not removed: seeing where you have been is
     half of reading a timetable. */
  .call.passed { opacity: .38; }
  .call.next {
    background: linear-gradient(90deg, rgba(185,140,255,0.14), transparent 70%);
    border-left: 3px solid var(--accent); padding-left: 9px;
  }
  .call.next .station { color: var(--accent-bright); }

  .times {
    font-family: 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums;
    font-size: 18px; line-height: 1.15;
  }
  .times .arr { color: var(--text-dim); font-size: 13.5px; display: block; }
  .station { font-size: 17px; font-weight: 500; }
  .platform { font-size: 12px; color: var(--dimmer); }
  .away {
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px;
    color: var(--text-dim); white-space: nowrap;
  }
  .away.now { color: var(--accent-bright); }

  /* Departure board rows borrow the Known Trains pill treatment: a solid
     coloured left edge in the operator's colour over the same dark panel.
     Everything else matches the stop list above. */
  .dep {
    display: grid; grid-template-columns: 62px 1fr auto;
    gap: 12px; align-items: baseline;
    padding: 11px 6px 11px 9px;
    border-bottom: 1px solid var(--hairline);
    border-left: 3px solid transparent;
  }
  .dep .time {
    font-family: 'Barlow Condensed', sans-serif; font-size: 18px;
    font-variant-numeric: tabular-nums;
  }
  .dep .dest { font-size: 16.5px; font-weight: 500; }
  .dep .sub { font-size: 12px; color: var(--dimmer); margin-top: 2px; }
  .dep .in {
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px;
    color: var(--text-dim); white-space: nowrap;
  }
  .dep.soon .in { color: var(--accent-bright); }

  .notice {
    padding: 16px 14px; color: var(--text-dim); font-size: 14px;
    border: 1px solid var(--hairline); border-radius: 10px; margin-top: 14px;
    background: rgba(255,255,255,0.02);
  }
  select {
    background: rgba(255,255,255,0.06); color: var(--text);
    border: 1px solid var(--hairline); border-radius: 6px;
    padding: 7px 10px; font-family: 'Barlow', sans-serif; font-size: 13px;
    max-width: 100%;
  }
  .picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .picker button {
    background: rgba(255,255,255,0.08); border: 1px solid var(--hairline);
    color: var(--text); border-radius: 6px; padding: 7px 12px;
    font-family: 'Barlow', sans-serif; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="hud-controls-overlay" id="hud-controls">
    <a class="brand" href="/">TSW HUD</a>
    <div>
      <button onclick="toggleFullScreen()">Full screen</button>
      <button onclick="exitApp()">Exit</button>
    </div>
  </div>

  <div class="wrap">
    <header class="service">
      <div>
        <div class="headcode" id="headcode">&mdash;</div>
        <div class="service-meta" id="serviceMeta">waiting for a service&hellip;</div>
      </div>
      <div class="clock" id="clock"></div>
    </header>

    <div id="calls"></div>
    <div id="notice"></div>
  </div>

<script src="/pages/hud-controls.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toggleFullScreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
function exitApp() { fetch('/api/shutdown', { method: 'POST' }); }

// A hand-picked service overrides the live lookup until cleared, so the page
// is usable for planning when the game is not running.
// ?name=P2K24 or ?service=2K24 pins a service from the URL, so a phone can
// be pointed straight at one without tapping through the picker.
const params = new URLSearchParams(location.search);
let pinned = params.get('name') || params.get('service') || null;
// Board mode is entered automatically when there is no service to follow,
// and left by choosing "back to my service". A station chosen by hand pins
// until then, so the board does not jump elsewhere while it is being read.
let boardMode = false;
let pinnedStation = params.get('station') || null;
let lastGood = null;
let lastGoodAt = 0;
let routesLoaded = false;

// How long a stop list stays on screen after the game stops naming a
// service. Long enough to ride out a dropped poll or the gap between two
// workings; short enough that it cannot show one service for an entire
// journey in another - which is exactly what happened when it was held
// indefinitely.
const STALE_AFTER_MS = 90000;

function hhmm(t) { return t ? String(t).slice(0, 5) : ''; }

function awayText(c) {
  if (c.passed || c.minutes_away == null) return '';
  if (c.minutes_away <= 0) return 'now';
  if (c.minutes_away < 60) return c.minutes_away + ' min';
  return Math.floor(c.minutes_away / 60) + 'h ' + (c.minutes_away % 60) + 'm';
}

function render(d) {
  const callsBox = document.getElementById('calls');
  const notice = document.getElementById('notice');

  if (!d.found) {
    setClockFrom(d);
    // Keep the last good timetable briefly rather than blanking it - a
    // dropped poll is not a reason to throw away the stop list someone is
    // reading. But only briefly, and say so, because a held service that
    // never expires reads as the CURRENT one.
    const age = Date.now() - lastGoodAt;
    if (lastGood && age < STALE_AFTER_MS) {
      document.getElementById('serviceMeta').innerHTML =
        `<span style="color:#e8b74a;">waiting for the game &mdash; `
        + `showing ${esc(lastGood.headcode || '')} from `
        + `${Math.round(age / 1000)}s ago</span>`;
      notice.innerHTML = pickerHtml();
      wirePicker();
      return;
    }
    lastGood = null;
    // Show WHAT the game reported and what is stored. "Nothing is showing"
    // gives no way to tell a missing extraction from a headcode that does
    // not match the stored form.
    document.getElementById('headcode').textContent =
      d.live_service_name || '\u2014';
    document.getElementById('serviceMeta').textContent =
      d.live_error === 'game_not_reachable' ? 'game not running'
      : d.live_service_name ? 'no stored timetable for this service'
      : 'no service';
    callsBox.innerHTML = '';
    const sh = d.stored_headcodes;
    notice.innerHTML = `<div class="notice">${esc(d.detail
      || 'No timetable for this service yet.')}`
      + (sh && sh.sample && sh.sample.length
          ? `<div style="margin-top:8px;font-size:12.5px;">Stored:
             ${sh.stored_services} services on ${esc((sh.routes || []).join(', '))}
             &mdash; e.g. ${sh.sample.map(esc).join(', ')}</div>` : '')
      + `</div>` + pickerHtml();
    wirePicker();
    return;
  }

  lastGood = d;
  lastGoodAt = Date.now();
  setClockFrom(d);
  document.getElementById('headcode').textContent =
    d.headcode || d.service_name || '\u2014';
  const parts = [];
  // The route is shown FIRST. A headcode is not unique across routes -
  // 2K24 exists on both the Fife Circle and the East Coast Main Line - so
  // the route is what tells you at a glance whether the right service was
  // matched.
  if (d.route_key) parts.push(esc(d.route_key));
  if (d.first_time) parts.push(hhmm(d.first_time) + ' \u2192 ' + hhmm(d.last_time));
  parts.push(d.call_count + ' stops');
  if (d.role === 'ai_continuation') parts.push('AI leg');
  if (pinned) parts.push('picked by hand');
  if (d.pinned_route) parts.push('route pinned');
  // Say so when the game's clock could not be read. A stop list marked
  // against the wrong clock looks like bad data rather than a missing
  // connection.
  if (d.clock_source === 'real') {
    parts.push('<span style="color:#e8b74a;">game clock unavailable</span>');
  }
  document.getElementById('serviceMeta').innerHTML = parts.join(' \u00b7 ');

  callsBox.innerHTML = (d.calls || []).map((c, i) => {
    const next = i === d.next_index;
    return `
      <div class="call ${c.passed ? 'passed' : ''} ${next ? 'next' : ''}">
        <div class="times">
          <span>${esc(hhmm(c.departure) || hhmm(c.arrival))}</span>
          ${c.arrival && c.departure
            ? `<span class="arr">arr ${esc(hhmm(c.arrival))}</span>` : ''}
        </div>
        <div>
          <div class="station">${esc(c.station_name || '\u2014')}</div>
          ${c.platform ? `<div class="platform">Platform ${esc(c.platform)}</div>` : ''}
        </div>
        <div class="away ${next ? 'now' : ''}">${esc(awayText(c))}</div>
      </div>`;
  }).join('');
  notice.innerHTML = pickerHtml();
  wirePicker();
}

function pickerHtml() {
  // The route selector PINS the route. Route detection needs
  // DriverAid.TrackData, which does not always answer, and a headcode that
  // exists on two routes then picks the wrong one. Pinning does not depend
  // on the game answering at all.
  return `<div class="picker">
    <select id="routeSel"><option value="">route: auto&hellip;</option></select>
    <select id="svcSel"><option value="">service&hellip;</option></select>
    ${pinned ? '<button id="unpinBtn">back to live</button>' : ''}
    <button id="diagBtn" title="Show what the game is actually returning">why?</button>
  </div>`;
}

// The picker is rebuilt on every render, so its handlers are attached each
// time rather than inline - inline handlers on regenerated markup were how
// the Known Trains page lost its buttons.
function wirePicker() {
  const routeSel = document.getElementById('routeSel');
  const svcSel = document.getElementById('svcSel');
  const unpin = document.getElementById('unpinBtn');
  if (unpin) unpin.onclick = () => { pinned = null; poll(); };
  const diag = document.getElementById('diagBtn');
  // The two paths that decide the route and the clock fail QUIETLY, each
  // falling back to something plausible. This shows what they actually
  // returned, so a wrong route or a real-time clock can be explained
  // instead of guessed at.
  if (diag) diag.onclick = async () => {
    const box = document.getElementById('notice');
    try {
      const d = await (await fetch('/api/timetable/diagnose')).json();
      const rows = ['player_info', 'time_of_day', 'track_data'].map(k =>
        `<div style="margin-bottom:6px;"><strong>${k}</strong>
          <span class="dim">status ${esc((d[k] || {}).status)}</span>
          <div style="font-size:11px;word-break:break-all;color:var(--text-dim);">
            ${esc(((d[k] || {}).body || (d[k] || {}).error || '').slice(0, 300))}</div>
        </div>`).join('');
      box.innerHTML = `<div class="notice" style="font-family:'Barlow Condensed',sans-serif;">
        <div style="margin-bottom:8px;">What the game is returning
          <span class="dim">(${esc(d.api_base || '')})</span></div>
        ${rows}
        <div style="font-size:12px;">headcode
          ${esc((d.interpreted || {}).headcode)} &middot; game clock
          ${esc((d.interpreted || {}).game_clock_seconds)} &middot; stations
          ${esc(JSON.stringify((d.interpreted || {}).station_names))}</div>
      </div>` + pickerHtml();
      wirePicker();
    } catch (e) { box.textContent = 'Diagnostic failed: ' + e.message; }
  };
  if (routeSel) routeSel.onchange = async () => {
    await fetch('/api/timetable/route_pin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ route: routeSel.value || '' })
    });
    loadServices(routeSel.value);
    poll();
  };
  if (svcSel) svcSel.onchange = () => {
    if (svcSel.value) { pinned = svcSel.value; poll(); }
  };
  if (!routesLoaded) { routesLoaded = true; loadServices(''); }
}

async function loadServices(route) {
  try {
    const d = await (await fetch('/api/timetable/services'
      + (route ? '?route=' + encodeURIComponent(route) : ''))).json();
    const routeSel = document.getElementById('routeSel');
    const svcSel = document.getElementById('svcSel');
    if (routeSel) {
      routeSel.innerHTML = '<option value="">route: auto&hellip;</option>'
        + (d.routes || []).map(r =>
            `<option ${r === route ? 'selected' : ''}>${esc(r)}</option>`).join('');
    }
    if (svcSel) {
      // Only services with calls are offered. Empty stock and continuation
      // legs are real records but have nothing to show on a stop list.
      svcSel.innerHTML = '<option value="">service&hellip;</option>'
        + (d.services || []).filter(s => s.n_calls).map(s =>
            `<option value="${esc(s.service_name || s.headcode)}">`
            + `${esc(hhmm(s.first_time))} ${esc(s.headcode || '')} `
            + `(${s.n_calls} stops)</option>`).join('');
    }
  } catch (e) { /* picker is optional; the live view still works */ }
}

function renderBoard(d) {
  const callsBox = document.getElementById('calls');
  const notice = document.getElementById('notice');
  document.getElementById('headcode').textContent = d.station || 'Departures';
  const bits = [];
  if (d.route_key) bits.push(esc(d.route_key));
  bits.push((d.departures || []).length + ' trains');
  if (d.detected_by === 'position') bits.push('found from where you are');
  else if (d.detected_by === 'track_data') bits.push('nearest station');
  document.getElementById('serviceMeta').innerHTML =
    'departure board \u00b7 ' + bits.join(' \u00b7 ');

  if (!(d.departures || []).length) {
    callsBox.innerHTML = '';
    notice.innerHTML = `<div class="notice">Nothing due at
      ${esc(d.station || 'this station')} in the next few hours.</div>`
      + stationPickerHtml(d);
    wireStationPicker();
    return;
  }

  callsBox.innerHTML = (d.departures || []).map(x => {
    const soon = x.minutes_away != null && x.minutes_away >= 0 && x.minutes_away <= 5;
    const when = x.minutes_away == null ? ''
      : x.minutes_away < 0 ? 'gone'
      : x.minutes_away === 0 ? 'now'
      : x.minutes_away < 60 ? x.minutes_away + ' min'
      : Math.floor(x.minutes_away / 60) + 'h ' + (x.minutes_away % 60) + 'm';
    // No colour means NO colour. Inventing one would imply the app knows
    // which operator runs this train when it does not.
    const edge = x.colour ? `border-left-color:${esc(x.colour)};` : '';
    return `
      <div class="dep ${soon ? 'soon' : ''}" style="${edge}">
        <div class="time">${esc(hhmm(x.departure) || hhmm(x.arrival))}</div>
        <div>
          <div class="dest">${esc(x.destination || '\u2014')}</div>
          <div class="sub">${esc(x.headcode || '')}${x.platform
            ? ' \u00b7 Platform ' + esc(x.platform) : ''}${x.origin
            ? ' \u00b7 from ' + esc(x.origin) : ''}</div>
        </div>
        <div class="in">${esc(when)}</div>
      </div>`;
  }).join('');
  notice.innerHTML = stationPickerHtml(d);
  wireStationPicker();
}

function stationPickerHtml(d) {
  const list = d.stations || [];
  return `<div class="picker">
    <select id="stationSel">
      <option value="">station&hellip;</option>
      ${list.map(s => `<option ${s.station_name === d.station ? 'selected' : ''}
        >${esc(s.station_name)}</option>`).join('')}
    </select>
    <button id="backLiveBtn">back to my service</button>
  </div>`;
}

function wireStationPicker() {
  const sel = document.getElementById('stationSel');
  const back = document.getElementById('backLiveBtn');
  if (sel) sel.onchange = () => { pinnedStation = sel.value || null; poll(); };
  if (back) back.onclick = () => { pinnedStation = null; boardMode = false;
                                   lastGood = null; poll(); };
}

async function poll() {
  try {
    // Board mode: standing in a station rather than driving. A station
    // chosen by hand pins, so the board does not jump elsewhere while it is
    // being read.
    if (pinnedStation || boardMode) {
      const b = await (await fetch('/api/timetable/board'
        + (pinnedStation ? '?station=' + encodeURIComponent(pinnedStation) : ''))).json();
      setClockFrom(b);
      if (b.found || pinnedStation) { renderBoard(b); return; }
      boardMode = false;          // could not place us; fall back and explain
    }

    const url = pinned
      ? '/api/timetable/live?name=' + encodeURIComponent(pinned)
      : '/api/timetable/live';
    const d = await (await fetch(url)).json();

    // Not in a timetabled service - on foot in a station, most likely. The
    // useful thing then is what is arriving and leaving around us, so switch
    // to the board automatically rather than showing an empty stop list.
    if (!d.found && !pinned && !lastGood) {
      const b = await (await fetch('/api/timetable/board')).json();
      setClockFrom(b);
      if (b.found && (b.departures || []).length) {
        boardMode = true;
        renderBoard(b);
        return;
      }
    }
    render(d);
  } catch (e) {
    // leave whatever is on screen
  }
}

// The clock shown is the GAME's, not this device's. A timetable is a list
// of game times, so showing the real time invites reading the two against
// each other and concluding the service is hours late.
//
// It is anchored to the last value the server sent and ticks locally between
// polls, re-anchoring every poll. TSW can run time faster than real time, so
// local ticking drifts - but only ever for the few seconds until the next
// poll corrects it.
let clockSeconds = null;
let clockSource = null;

function setClockFrom(d) {
  if (!d || !d.clock) return;
  const p = String(d.clock).split(':').map(Number);
  if (p.length >= 2 && !p.some(isNaN)) {
    clockSeconds = p[0] * 3600 + p[1] * 60 + (p[2] || 0);
    clockSource = d.clock_source || null;
  }
}

function tick() {
  const el = document.getElementById('clock');
  if (clockSeconds == null) {
    // Nothing from the game yet. Show the device clock, clearly marked, so
    // it is never mistaken for the in-game time.
    const now = new Date();
    el.innerHTML = String(now.getHours()).padStart(2, '0') + ':' +
      String(now.getMinutes()).padStart(2, '0') +
      ' <span style="font-size:11px;color:#6c6875;">real</span>';
    return;
  }
  clockSeconds = (clockSeconds + 1) % 86400;
  const h = Math.floor(clockSeconds / 3600), m = Math.floor((clockSeconds % 3600) / 60);
  el.innerHTML = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0')
    + (clockSource === 'real'
        ? ' <span style="font-size:11px;color:#6c6875;">real</span>' : '');
}

initHudControls('hud-controls');
tick();
poll();
setInterval(tick, 1000);
// The booked timetable does not change; only our position through it does,
// so a slow poll is plenty and keeps the load off the game.
setInterval(poll, 5000);
</script>
</body>
</html>
