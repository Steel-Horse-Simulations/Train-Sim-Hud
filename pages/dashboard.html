<!-- TSW Hud [v1.0.1] [dev] [main] -->
<!-- Last modified: 2025-08-01 -->
<!DOCTYPE html>
<html lang="en" data-theme="purple">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSW HUD - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pages/style.css">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    main {
      width: 100%;
      height: 100%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .hud-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .hud-stage {
      width: 100%;
      height: 100%;
      max-width: 1340px;
      aspect-ratio: 1340 / 800;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--accent) 22%, transparent), rgba(0,0,0,0.55)),
        linear-gradient(160deg, #1c1620, #0c0a0e);
    }

    .hud-corner {
      position: absolute;
      padding: 14px 18px;
      background: rgba(20,18,24,0.82);
      backdrop-filter: blur(6px);
      border: 1px solid var(--hairline);
      border-radius: 8px;
    }

    .hud-route {
      left: 28px;
      top: 28px;
      width: 280px;
    }

    .loco-class {
      font-family: var(--heading);
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 8px;
      display: none;
    }

    .loco-class.missing {
      color: var(--text-dim);
      font-style: italic;
      font-weight: 500;
    }

    .hud-kv {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin: 4px 0;
    }

    .hud-kv .k {
      color: var(--text-dim);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .hud-kv .v {
      font-family: var(--heading);
      font-weight: 600;
    }

    .hud-signal {
      right: 28px;
      top: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-signal .lamp {
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }

    .hud-signal .t1 {
      font-family: var(--heading);
      font-weight: 600;
      font-size: 15px;
    }

    .hud-signal .t2 {
      font-size: 12px;
      color: var(--text-dim);
    }

    .hud-speed-cluster {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 18px 28px;
    }

    .hud-gauge {
      width: 210px;
      height: 210px;
      position: relative;
    }

    .hud-gauge svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .over-max-badge {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: var(--heading);
      font-size: 14px;
      font-weight: 600;
      color: var(--status-red);
      text-align: center;
      padding: 20px;
    }

    .over-max-badge.visible {
      display: flex;
    }

    .speed-num {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .speed-num .n {
      font-family: var(--heading);
      font-weight: 600;
      font-size: 66px;
      line-height: 1;
    }

    .speed-num .u {
      font-family: var(--heading);
      font-size: 15px;
      color: var(--text-dim);
      letter-spacing: 0.14em;
      margin-top: 4px;
    }

    .hud-limit-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 5px solid var(--status-red);
      background: #f5f5f2;
    }

    .hud-limit-chip .n {
      font-family: var(--heading);
      font-weight: 700;
      font-size: 38px;
      color: #141414;
    }

    .hud-weather {
      right: 28px;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-weather .icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      color: var(--text);
      opacity: 0.9;
    }

    .hud-weather .t1 {
      font-family: var(--heading);
      font-weight: 600;
      font-size: 18px;
    }

    .hud-weather .t2 {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .hud-limits-panel {
      left: 28px;
      bottom: 28px;
      width: 210px;
      display: none;
    }

    .hud-limits-panel h3 {
      margin: 0 0 8px;
      font-family: var(--heading);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-bright);
    }

    .hud-limits-row {
      display: flex;
      gap: 16px;
    }

    .hud-limits-row .limit-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .hud-limits-row .chip {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--status-red);
      background: #f5f5f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--heading);
      font-weight: 700;
      font-size: 15px;
      color: #141414;
    }

    .hud-limits-row .dist {
      font-size: 11px;
      color: var(--text-dim);
    }

    .hud-controls-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 500;
    }

    .hud-controls-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .hud-controls-overlay .brand {
      font-family: var(--heading);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
    }

    .hud-controls-overlay .btns {
      display: flex;
      gap: 8px;
    }

    .fullscreen-btn {
      padding: 6px 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--hairline);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      font-family: var(--sans);
      transition: background 0.2s;
    }

    .fullscreen-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    .exit-btn {
      padding: 6px 12px;
      background: rgba(224,90,78,0.2);
      border: 1px solid var(--status-red);
      color: var(--status-red);
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      font-family: var(--sans);
      transition: background 0.2s;
    }

    .exit-btn:hover {
      background: rgba(224,90,78,0.3);
    }

    #poll-status {
      position: fixed;
      bottom: 12px;
      right: 12px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--mono);
    }
  </style>
</head>
<body>
  <div class="hud-controls-overlay" id="hud-controls">
    <a href="/" class="brand">TSW Hud · dashboard</a>
    <div class="btns">
      <button class="fullscreen-btn" onclick="toggleFullScreen()">Full Screen</button>
      <button class="exit-btn" onclick="exitApp()">Exit</button>
    </div>
  </div>

  <main>
    <div class="hud-wrap">
      <div class="hud-stage" id="hud-stage">
        <!-- Route and gradient info (top-left) -->
        <div class="hud-corner hud-route">
          <div class="loco-class" id="v-loco"></div>
          <div class="hud-kv"><span class="k">Gradient</span><span class="v"><span id="v-gradient">—</span></span></div>
          <div class="hud-kv"><span class="k">Distance to signal</span><span class="v" id="v-dist">—</span></div>
        </div>

        <!-- Signal aspect (top-right) -->
        <div class="hud-corner hud-signal">
          <div class="lamp" id="signal-lamp" style="background:#4f8fc0;"></div>
          <div><div class="t1" id="v-signal-text">—</div><div class="t2">Next signal</div></div>
        </div>

        <!-- Speed gauge and limit (center) -->
        <div class="hud-corner hud-speed-cluster">
          <div class="hud-gauge">
            <div class="over-max-badge" id="over-max-badge">Over max speed</div>
            <svg viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="50" fill="none" stroke="#2a2a30" stroke-width="8"/>
              <circle id="gauge-ring" cx="60" cy="60" r="50" fill="none" stroke="#5fd07a" stroke-width="8"
                      stroke-dasharray="0 314" stroke-linecap="round"/>
              <line id="max-tick" class="max-tick" x1="60" y1="10" x2="60" y2="22"
                    stroke="#eef0f4" stroke-width="3" stroke-linecap="round" style="display:none;"/>
            </svg>
            <div class="speed-num"><div class="n" id="v-speed">—</div><div class="u">MPH</div></div>
          </div>
          <div class="hud-limit-chip"><div class="n" id="v-limit">—</div></div>
        </div>

        <!-- Upcoming speed limits (bottom-left) -->
        <div class="hud-corner hud-limits-panel" id="limits-panel">
          <h3>Limits ahead</h3>
          <div class="hud-limits-row" id="limits-row"></div>
        </div>

        <!-- Weather (bottom-right) -->
        <div class="hud-corner hud-weather">
          <svg class="icon" id="weather-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 19a4 4 0 0 1-.4-7.98A5.5 5.5 0 0 1 16.6 8.5 4.5 4.5 0 0 1 16 19H6.5Z"/>
          </svg>
          <div>
            <div class="t1" id="w-hud-text">—</div>
            <div class="t2" id="w-hud-source">—</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="poll-status"></div>

  <script>
    // =====================================================================
    // DASHBOARD POLLING SYSTEM
    // =====================================================================
    // Implements three concurrent polling loops:
    // 1. pollSpeed() - every 300ms (speed, gauge, over-max badge)
    // 2. poll() - every 2000ms (gradient, limit, signal, weather, time)
    // 3. pollLoco() - every 10000ms (loco name, max speed)
    // =====================================================================

    const API_BASE = '/api/proxy/get';
    let currentMaxSpeedMph = 100;
    let currentLimitMph = 0;
    let pollInFlight = false;
    let speedPollInFlight = false;
    let pollInterval = null;
    let speedInterval = null;
    let locoInterval = null;

    const DIAL_HEADROOM_MULTIPLIER = 1.2;
    const ABORT_TIMEOUT_MS = 4000;
    const MAX_SPEED_SENTINEL = 112; // m/s, ~250 mph

    // =====================================================================
    // UTILITY FUNCTIONS
    // =====================================================================

    function fmtSpeed(ms) {
      if (ms === null || ms === undefined) return '—';
      return Math.round(ms * 2.23694).toLocaleString();
    }

    function fmtDistance(cm) {
      if (cm === null || cm === undefined) return '—';
      const m = cm / 100;
      if (m >= 1000) {
        const km = m / 1000;
        return km.toFixed(1) + ' km';
      }
      return Math.round(m) + ' m';
    }

    function getSignalColor(aspect) {
      const lower = (aspect || '').toLowerCase();
      if (lower.includes('clear') || lower.includes('green')) return '#5fd07a';
      if (lower.includes('caution') || lower.includes('yellow') || lower.includes('amber')) return '#e8b74a';
      if (lower.includes('danger') || lower.includes('red') || lower.includes('stop')) return '#e05a4e';
      return '#4f8fc0'; // unknown/blue
    }

    function updateGaugeRing(speedMph, limitMph) {
      const dialMax = currentMaxSpeedMph * DIAL_HEADROOM_MULTIPLIER;
      const fraction = Math.min(speedMph / dialMax, 1);
      const circumference = 314;
      const dasharray = (fraction * circumference).toFixed(1);

      document.getElementById('gauge-ring').setAttribute('stroke-dasharray', `${dasharray} ${circumference}`);

      // Ring color: green if under limit, yellow if within 5mph, red if over
      let ringColor = '#5fd07a';
      if (speedMph > limitMph) ringColor = '#e05a4e';
      else if (limitMph > 0 && speedMph >= limitMph - 5) ringColor = '#e8b74a';

      document.getElementById('gauge-ring').setAttribute('stroke', ringColor);

      // Over-max badge
      const overMaxBadge = document.getElementById('over-max-badge');
      if (speedMph > currentMaxSpeedMph) {
        overMaxBadge.classList.add('visible');
      } else {
        overMaxBadge.classList.remove('visible');
      }
    }

    function updatePollStatus(msg) {
      const el = document.getElementById('poll-status');
      if (el) el.textContent = msg;
    }

    // =====================================================================
    // POLLING FUNCTIONS
    // =====================================================================

    async function pollSpeed() {
      if (speedPollInFlight) return;
      speedPollInFlight = true;

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), ABORT_TIMEOUT_MS);

        const res = await fetch(`${API_BASE}/CurrentDrivableActor.Function.HUD_GetSpeed`, {
          signal: controller.signal
        }).then(r => r.json());

        clearTimeout(timeout);

        const speedMs = res.Values?.ReturnValue || 0;
        const speedMph = speedMs * 2.23694;

        document.getElementById('v-speed').textContent = fmtSpeed(speedMs);
        updateGaugeRing(speedMph, currentLimitMph);
      } catch (e) {
        // Silent fail on speed poll - next tick will retry
      } finally {
        speedPollInFlight = false;
      }
    }

    async function poll() {
      if (pollInFlight) return;
      pollInFlight = true;

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), ABORT_TIMEOUT_MS);

        // DriverAid.Data
        const driverRes = await fetch(`${API_BASE}/DriverAid.Data`, {
          signal: controller.signal
        }).then(r => r.json());

        const driverData = driverRes.Values || {};

        // Gradient
        const gradient = driverData.gradient || 0;
        document.getElementById('v-gradient').textContent =
          (gradient >= 0 ? '+' : '') + gradient.toFixed(1) + '%';

        // Distance to signal
        const distCm = driverData.distanceToSignal || 0;
        document.getElementById('v-dist').textContent = fmtDistance(distCm);

        // Signal aspect
        const signalAspect = driverData.signalAspectClass || 'Unknown';
        document.getElementById('v-signal-text').textContent = signalAspect;
        const lampColor = getSignalColor(signalAspect);
        const lampEl = document.getElementById('signal-lamp');
        lampEl.style.background = lampColor;
        lampEl.style.boxShadow = `0 0 10px ${lampColor}`;

        // Speed limit
        let speedLimitMs = driverData.speedLimit?.value || 0;
        if (speedLimitMs >= MAX_SPEED_SENTINEL || speedLimitMs < 0) {
          speedLimitMs = 0;
        }
        const limitMph = speedLimitMs * 2.23694;
        currentLimitMph = limitMph;

        if (speedLimitMs >= MAX_SPEED_SENTINEL || speedLimitMs <= 0) {
          document.getElementById('v-limit').textContent = '—';
        } else {
          document.getElementById('v-limit').textContent = Math.round(limitMph);
        }

        // Upcoming speed limits
        const nextLimits = driverData.nextSpeedLimits || [];
        if (nextLimits.length > 0) {
          document.getElementById('limits-panel').style.display = 'block';
          const limitsRow = document.getElementById('limits-row');
          limitsRow.innerHTML = nextLimits.slice(0, 3).map(limit => {
            let limitMsValue = limit.value?.value || 0;
            if (limitMsValue >= MAX_SPEED_SENTINEL || limitMsValue < 0) limitMsValue = 0;
            const mph = Math.round(limitMsValue * 2.23694);
            const dist = fmtDistance(limit.distanceToNextSpeedLimit || 0);
            return `<div class="limit-item"><div class="chip">${mph}</div><div class="dist">${dist}</div></div>`;
          }).join('');
        } else {
          document.getElementById('limits-panel').style.display = 'none';
        }

        // WeatherManager.Data
        const weatherRes = await fetch(`${API_BASE}/WeatherManager.Data`, {
          signal: controller.signal
        }).then(r => r.json());

        const weather = weatherRes.Values || {};
        const temp = Math.round(weather.Temperature || 12);
        const cloudiness = Math.round((weather.Cloudiness || 0) * 100);
        const precipitation = Math.round((weather.Precipitation || 0) * 100);

        let weatherDesc = 'Clear';
        if (precipitation > 10) weatherDesc = 'Rain';
        else if (cloudiness > 80) weatherDesc = 'Overcast';
        else if (cloudiness > 50) weatherDesc = 'Cloudy';
        else if (cloudiness > 20) weatherDesc = 'Partly cloudy';

        document.getElementById('w-hud-text').textContent = `${temp}°C · ${weatherDesc}`;
        document.getElementById('w-hud-source').textContent = 'In-game weather';

        updatePollStatus('·');

      } catch (e) {
        updatePollStatus('· waiting for game…');
      } finally {
        pollInFlight = false;
      }
    }

    async function pollLoco() {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), ABORT_TIMEOUT_MS);

        const res = await fetch('/api/loco', {
          signal: controller.signal
        }).then(r => r.json());

        const data = res || {};
        const el = document.getElementById('v-loco');

        if (data.name) {
          el.textContent = data.name;
          el.classList.remove('missing');
        } else {
          el.textContent = 'Missing Train Class';
          el.classList.add('missing');
        }
        el.style.display = 'block';

        if (data.max_speed_mph) {
          currentMaxSpeedMph = data.max_speed_mph;
        }

        // Retrigger gauge ring update with new max speed
        const speedEl = document.getElementById('v-speed');
        if (speedEl.textContent !== '—') {
          const speedMs = parseFloat(speedEl.textContent.replace(/,/g, '')) / 2.23694;
          updateGaugeRing(parseFloat(speedEl.textContent.replace(/,/g, '')), currentLimitMph);
        }

      } catch (e) {
        // Silent fail
      }
    }

    // =====================================================================
    // HUD CONTROLS
    // =====================================================================

    function toggleFullScreen() {
      try {
        if (!document.fullscreenElement) {
          document.getElementById('hud-stage').requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      } catch (err) {
        console.error('Fullscreen error:', err);
      }
    }

    function exitApp() {
      fetch('/api/shutdown', { method: 'POST' });
    }

    function initHudControls(containerId) {
      const overlay = document.getElementById(containerId);
      let hideTimeout;

      function showOverlay() {
        overlay.classList.add('visible');
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
          overlay.classList.remove('visible');
        }, 2500);
      }

      document.addEventListener('pointermove', showOverlay);
      document.addEventListener('pointerdown', showOverlay);
      document.addEventListener('touchstart', showOverlay);

      // Show on load
      showOverlay();
    }

    // =====================================================================
    // INITIALIZATION
    // =====================================================================

    function startDashboard() {
      // Start all three polling loops
      pollSpeed();
      speedInterval = setInterval(pollSpeed, 300);

      poll();
      pollInterval = setInterval(poll, 2000);

      pollLoco();
      locoInterval = setInterval(pollLoco, 10000);
    }

    // Begin on page load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        startDashboard();
        initHudControls('hud-controls');
      });
    } else {
      startDashboard();
      initHudControls('hud-controls');
    }
  </script>
</body>
</html>
