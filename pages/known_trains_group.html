<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TSW Hud - Group Settings</title>
<link rel="stylesheet" href="/pages/style.css">
<script src="/pages/theme.js"></script>

<style>
  main { max-width: 700px; margin: 0 auto; }
  .back { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  h1 { font-family: var(--heading); font-size: 22px; margin: 10px 0 20px; }


    main { padding-top: 10px; }
  }



  form label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; margin-top: 14px; }
  form label:first-child { margin-top: 0; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--hairline); }
  .toggle-row:first-of-type { border-top: none; }
  .toggle-row .lbl { font-size: 13.5px; }
  .toggle-row .lbl .sub { display: block; font-size: 11px; color: var(--text-dim); }
  .switch { width: 38px; height: 20px; border-radius: 12px; background: rgba(255,255,255,0.1); position: relative; cursor: pointer; flex: none; }
  .switch.on { background: var(--accent); }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on::after { left: 20px; }

  .member-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--hairline); text-decoration: none; color: var(--text); }
  .member-row:first-of-type { border-top: none; }
  .member-row .name { flex: 1; font-size: 13.5px; }
  .member-row:hover .name { color: var(--accent-bright); }
  .member-row .sub-tag { font-size: 11px; color: var(--text-dim); background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 10px; }
  .add-btn { background: transparent; border: 1px dashed var(--hairline); color: var(--text-dim); padding: 8px; border-radius: 6px; width: 100%; margin-top: 10px; cursor: pointer; font-size: 13px; text-align: center; display: block; text-decoration: none; }

  .subclass-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--hairline); }
  .subclass-row:first-of-type { border-top: none; }
  .subclass-row .name { width: 80px; font-weight: 600; font-size: 13.5px; flex-shrink: 0; }
  .subclass-row input { width: 90px; font-size: 13px; padding: 5px 8px; }

  .add-subclass-form {
    display: none; align-items: center; gap: 10px; padding: 12px; margin-top: 10px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--hairline); border-radius: 8px;
  }
  .add-subclass-form.open { display: flex; flex-wrap: wrap; }
  .add-subclass-form .field { display: flex; flex-direction: column; gap: 3px; }
  .add-subclass-form .field label { margin: 0; font-size: 10.5px; }
  .add-subclass-form input { width: 90px; font-size: 13px; padding: 6px 8px; }
  .add-subclass-form input#newSubName { width: 110px; }
  .add-subclass-form .actions { display: flex; gap: 8px; margin-left: auto; align-self: flex-end; }
  .save-status { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; height: 14px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><strong>TSW Hud</strong> · group settings</div>
    <div class="nav" id="navContainer"></div>
    <button class="exit-btn" onclick="exitApp()">Exit</button>
  </div>

  <main>

    <a class="back" href="/pages/known_trains.html">&larr; Back to Known Trains</a>
    <h1 id="pageTitle">Group Settings</h1>

    <div class="panel">
      <h2>Group name</h2>
      <input type="text" id="f-name">
      <div class="save-status" id="nameSaveStatus"></div>
    </div>

    <div class="panel">
      <h2>Default speeds (used unless a subclass or individual train overrides them)</h2>
      <label>Max train speed</label>
      <input type="text" id="f-defaultMaxSpeed" style="width:100px;"> mph
      <label>Speedometer dial max</label>
      <input type="text" id="f-defaultDialMax" style="width:100px;"> mph
      <div class="save-status" id="speedSaveStatus"></div>
    </div>

    <div class="panel">
      <h2>Subclasses</h2>
      <div id="subclassRows"></div>
      <button class="add-btn" id="addSubclassBtn">+ Add subclass</button>
      <div class="add-subclass-form" id="addSubclassForm">
        <div class="field">
          <label>Subclass name</label>
          <input type="text" id="newSubName" placeholder="e.g. 66/7">
        </div>
        <div class="field">
          <label>Max speed override (mph)</label>
          <input type="text" id="newSubSpeed" placeholder="uses group default">
        </div>
        <div class="actions">
          <button class="btn" id="cancelSubBtn">Cancel</button>
          <button class="btn primary" id="confirmSubBtn" disabled>Add</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>HUD panels for this group</h2>
      <div id="panelToggles"></div>
    </div>

    <div class="panel">
      <h2 id="membersHeading">Members of this group</h2>
      <div id="membersList"></div>
      <a class="add-btn" href="/pages/known_trains.html">+ Add a train you've driven to this group (edit it from the list)</a>
    </div>
  </main>

<script>
const groupId = new URLSearchParams(location.search).get('id');
let groupData = null;

async function load() {
  const res = await fetch(`/api/known_trains/groups/${groupId}`);
  groupData = await res.json();

  document.getElementById('pageTitle').textContent = `Group Settings — ${groupData.name}`;
  document.getElementById('f-name').value = groupData.name;
  document.getElementById('f-defaultMaxSpeed').value = groupData.default_max_speed_mph ?? '';
  document.getElementById('f-defaultDialMax').value = groupData.default_dial_max_mph ?? '';

  renderSubclasses();
  renderPanelToggles();
  renderMembers();
}

function renderSubclasses() {
  const container = document.getElementById('subclassRows');
  container.innerHTML = groupData.subclasses.map(s => `
    <div class="subclass-row" data-id="${s.id}">
      <span class="name">${s.name}</span>
      <input type="text" placeholder="uses group default" value="${s.max_speed_override_mph ?? ''}"
             onchange="saveSubclassSpeed(${s.id}, this.value)">
      <span style="color:var(--text-dim); font-size:12px;">${s.max_speed_override_mph != null ? 'mph override' : `mph — leave blank to use the group's ${groupData.default_max_speed_mph ?? '?'}mph`}</span>
    </div>
  `).join('');
}

let allGauges = [];

async function renderPanelToggles() {
  if (!allGauges.length) {
    const res = await fetch('/api/gauges');
    allGauges = await res.json();
  }
  const panels = groupData.hud_panels || [];
  document.getElementById('panelToggles').innerHTML = allGauges.map(g => {
    if (g.core) {
      return `<div class="toggle-row"><span class="lbl">${g.name}<span class="sub">${g.note || ''}</span></span><div class="switch on" style="opacity:.4; cursor:default;"></div></div>`;
    }
    const on = panels.includes(g.key);
    return `<div class="toggle-row"><span class="lbl">${g.name}<span class="sub">${g.note || ''}</span></span><div class="switch${on ? ' on' : ''}" onclick="togglePanel('${g.key}')"></div></div>`;
  }).join('');
}

async function togglePanel(key) {
  const panels = new Set(groupData.hud_panels || []);
  if (panels.has(key)) panels.delete(key); else panels.add(key);
  groupData.hud_panels = Array.from(panels);
  renderPanelToggles();
  await fetch(`/api/known_trains/groups/${groupId}`, {
    method: 'PATCH', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ hud_panels: groupData.hud_panels }),
  });
}

function renderMembers() {
  document.getElementById('membersHeading').textContent = `Members of this group (${groupData.members.length})`;
  const list = document.getElementById('membersList');
  if (!groupData.members.length) {
    list.innerHTML = '<p class="small dim">No trains assigned to this group yet.</p>';
    return;
  }
  const subclassesById = {};
  groupData.subclasses.forEach(s => { subclassesById[s.id] = s.name; });
  list.innerHTML = groupData.members.map(m => `
    <a class="member-row" href="/pages/known_trains_edit.html?id=${m.id}">
      <span class="name">${m.display_name || m.source_name}</span>
      ${m.subclass_id ? `<span class="sub-tag">${subclassesById[m.subclass_id] || ''}</span>` : ''}
    </a>
  `).join('');
}

// Group name: save on change (blur), not on every keystroke
document.getElementById('f-name').addEventListener('change', async (e) => {
  const status = document.getElementById('nameSaveStatus');
  status.textContent = 'Saving…';
  const res = await fetch(`/api/known_trains/groups/${groupId}`, {
    method: 'PATCH', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name: e.target.value }),
  });
  status.textContent = res.ok ? 'Saved' : 'Failed to save';
  setTimeout(() => { status.textContent = ''; }, 1500);
});

// Default speeds: save on change
['f-defaultMaxSpeed', 'f-defaultDialMax'].forEach(id => {
  document.getElementById(id).addEventListener('change', async () => {
    const status = document.getElementById('speedSaveStatus');
    status.textContent = 'Saving…';
    const maxVal = document.getElementById('f-defaultMaxSpeed').value;
    const dialVal = document.getElementById('f-defaultDialMax').value;
    const res = await fetch(`/api/known_trains/groups/${groupId}`, {
      method: 'PATCH', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        default_max_speed_mph: maxVal === '' ? null : Number(maxVal),
        default_dial_max_mph: dialVal === '' ? null : Number(dialVal),
      }),
    });
    if (res.ok) { groupData = await res.json(); groupData.subclasses = (await (await fetch(`/api/known_trains/groups/${groupId}`)).json()).subclasses; renderSubclasses(); }
    status.textContent = res.ok ? 'Saved' : 'Failed to save';
    setTimeout(() => { status.textContent = ''; }, 1500);
  });
});

async function saveSubclassSpeed(subclassId, value) {
  await fetch(`/api/known_trains/subclasses/${subclassId}`, {
    method: 'PATCH', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ max_speed_override_mph: value === '' ? null : Number(value) }),
  });
  await load(); // refresh so captions ("mph override" vs "uses group default") stay correct
}

// Add-subclass form (same tested interaction as the approved preview)
const addBtn = document.getElementById('addSubclassBtn');
const form = document.getElementById('addSubclassForm');
const nameInput = document.getElementById('newSubName');
const speedInput = document.getElementById('newSubSpeed');
const confirmBtn = document.getElementById('confirmSubBtn');
const cancelBtn = document.getElementById('cancelSubBtn');

function openForm() { addBtn.style.display = 'none'; form.classList.add('open'); nameInput.focus(); }
function closeForm() { form.classList.remove('open'); addBtn.style.display = 'block'; nameInput.value = ''; speedInput.value = ''; confirmBtn.disabled = true; }

addBtn.addEventListener('click', openForm);
cancelBtn.addEventListener('click', closeForm);
nameInput.addEventListener('input', () => { confirmBtn.disabled = nameInput.value.trim() === ''; });

confirmBtn.addEventListener('click', async () => {
  const name = nameInput.value.trim();
  if (!name) return;
  const speed = speedInput.value.trim();
  await fetch(`/api/known_trains/groups/${groupId}/subclasses`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name, max_speed_override_mph: speed === '' ? null : Number(speed) }),
  });
  closeForm();
  await load();
});

function exitApp() { fetch('/api/shutdown', {method: 'POST'}); }



load();
</script>
<script src="/pages/nav.js"></script>
</body>
</html>
