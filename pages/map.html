<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TSW Hud - Map</title>
<link rel="stylesheet" href="/pages/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="/pages/theme.js"></script>
<script src="/pages/hud-controls.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; }
  main { padding: 0; height: 100%; overflow: hidden; }
  #map { position: absolute; inset: 0; background: #0b0a10; }

  .waiting {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--heading); font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-dim); z-index: 100; pointer-events: none;
  }

  /* Themed dot marker */
  .player-dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent-bright);
    border: 2px solid rgba(255,255,255,0.9);
    box-shadow: 0 0 10px var(--accent-bright), 0 0 0 6px rgba(160,107,240,0.2);
    box-shadow: 0 0 10px var(--accent-bright), 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  [data-theme="rainbow"] .player-dot {
    background: conic-gradient(from 0deg, #ff5f5f, #ffbb5f, #f5e75f, #7fe37f, #5fb8ff, #a06bf0, #ff5f5f);
  }

  /* Keep the required OSM attribution small and unobtrusive */
  .leaflet-control-attribution { font-size: 10px; background: rgba(10,10,11,0.75) !important; color: #999 !important; }
  .leaflet-control-attribution a { color: #bbb !important; }

  .rail-toggle-btn {
    background: var(--panel-raised); border: 1px solid var(--hairline); color: var(--text);
    font-family: var(--heading); font-size: 12px; letter-spacing: 0.04em;
    padding: 6px 12px; border-radius: 4px; cursor: pointer;
  }
  .rail-toggle-btn:hover { border-color: var(--accent); }
  .rail-toggle-btn.active { border-color: var(--accent); color: var(--accent-bright); }
</style>
</head>
<body>
  <div class="hud-controls-overlay" id="hud-controls">
    <a href="/" class="brand" style="text-decoration:none;"><strong>TSW Hud</strong> · map</a>
    <div class="btns">
      <button class="rail-toggle-btn" id="rail-toggle-btn" onclick="toggleRailOverlay()">Rail Overlay: Off</button>
      <button class="rail-toggle-btn" id="historic-toggle-btn" onclick="toggleHistoric()">Historic Lines: Hidden</button>
      <button class="fullscreen-btn" onclick="toggleFullScreen()">Full Screen</button>
      <button class="exit-btn" onclick="exitApp()">Exit</button>
    </div>
  </div>

  <main>
    <div id="map"></div>
    <div class="waiting" id="waiting">Waiting for player location…</div>
  </main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DEFAULT_ZOOM = 17;   // two notches closer than the previous 15
const MOVE_DURATION_MS = 1800; // just under the 2s poll interval, so motion finishes before the next update
let map = null;
let marker = null;
let moveAnimFrame = null;
let railLayer = null;
let railOverlayOn = false; // defaults to off every launch
let liveryColour = null;   // colour of the train currently being driven
let hideHistoric = true;   // mask out disused/abandoned lines
const railTiles = new Set();

// OpenRailwayMap's INFRASTRUCTURE style ("standard") is the one with the
// line-thickness and tunnel treatment worth keeping - tunnels drawn hollow,
// sidings thinner than running lines. It also draws disused, abandoned and
// razed alignments, which are not wanted here.
const RAIL_STYLE_URL = 'https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png';
// The GAUGE style renders only track that carries gauge tagging, which in
// practice excludes historic alignments. It is used purely as a STENCIL -
// none of its colours are shown. Infrastructure supplies every visible
// pixel; gauge only decides which pixels survive.
const RAIL_MASK_URL = 'https://{s}.tiles.openrailwaymap.org/gauge/{z}/{x}/{y}.png';
const RAIL_SUBDOMAINS = ['a', 'b', 'c'];
// Gauge draws thinner than infrastructure, so masking straight would shave
// the casings off every line. The stencil is dilated first.
const MASK_DILATE_PX = 2;

function animateMarkerAndMap(newLat, newLon) {
  const start = marker.getLatLng();
  const startTime = performance.now();
  if (moveAnimFrame) cancelAnimationFrame(moveAnimFrame);

  function step(now) {
    const t = Math.min(1, (now - startTime) / MOVE_DURATION_MS);
    const lat = start.lat + (newLat - start.lat) * t;
    const lon = start.lng + (newLon - start.lng) * t;
    marker.setLatLng([lat, lon]);
    if (t < 1) {
      moveAnimFrame = requestAnimationFrame(step);
    }
  }
  moveAnimFrame = requestAnimationFrame(step);

  // easeLinearity: 1 makes the map's own pan linear too, matching the
  // marker's linear interpolation above so they move together instead of
  // the dot reaching the new spot before the map catches up (which is what
  // was reading as a sudden jump).
  map.panTo([newLat, newLon], { animate: true, duration: MOVE_DURATION_MS / 1000, easeLinearity: 1 });
}

// Composites one tile: infrastructure artwork, stencilled by gauge, painted
// in the livery colour.
//
// Every step is alpha-preserving on purpose. The whole point of using the
// infrastructure style is its line weights and its hollow tunnel casings,
// and those live entirely in the alpha channel - flatten alpha and the
// overlay becomes uniform spaghetti. So:
//   destination-in  keeps base pixels only where the stencil covers them,
//                   multiplying alpha rather than replacing it;
//   source-in       paints a flat colour through whatever alpha survives,
//                   giving the EXACT livery colour while thickness,
//                   anti-aliasing and tunnel translucency all carry through.
function compositeRailTile(canvas, base, mask, colour) {
  const ctx = canvas.getContext('2d');
  const S = canvas.width;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, S, S);
  if (!base) return;
  ctx.drawImage(base, 0, 0, S, S);

  if (mask) {
    // Dilate by drawing the stencil at every offset within a small radius
    // and unioning them. Done on a scratch canvas: applying the offsets
    // straight onto the tile with destination-in would multiply alpha
    // repeatedly and ERODE the lines instead of growing them.
    const m = document.createElement('canvas');
    m.width = m.height = S;
    const mc = m.getContext('2d');
    for (let dx = -MASK_DILATE_PX; dx <= MASK_DILATE_PX; dx++) {
      for (let dy = -MASK_DILATE_PX; dy <= MASK_DILATE_PX; dy++) {
        if (Math.abs(dx) + Math.abs(dy) <= MASK_DILATE_PX) {
          mc.drawImage(mask, dx, dy, S, S);
        }
      }
    }
    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(m, 0, 0);
  }

  if (colour) {
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = colour;
    ctx.fillRect(0, 0, S, S);
  }
  ctx.globalCompositeOperation = 'source-over';
}

// Built inside a function rather than at top level, because
// `L.GridLayer.extend` needs Leaflet to have loaded. At top level, one failed
// CDN fetch throws before the rest of the script runs - the page then loses
// its livery polling entirely and shows an uncoloured map with no obvious
// cause. Deferring it keeps the failure contained to the map itself.
function makeRailLayer() {
  const TintedRailLayer = L.GridLayer.extend({
  createTile: function (coords, done) {
    const canvas = L.DomUtil.create('canvas');
    const S = this.getTileSize().x;
    canvas.width = canvas.height = S;

    const sub = RAIL_SUBDOMAINS[Math.abs(coords.x + coords.y) % RAIL_SUBDOMAINS.length];
    const url = (tpl) => tpl.replace('{s}', sub).replace('{z}', coords.z)
                            .replace('{x}', coords.x).replace('{y}', coords.y);

    let pending = hideHistoric ? 2 : 1;
    const settle = () => {
      if (--pending > 0) return;
      // If the stencil failed to load, draw the infrastructure tile
      // UNMASKED rather than masking with nothing - masking against a
      // missing stencil would erase the tile completely and look like a
      // broken overlay rather than a missing filter.
      compositeRailTile(canvas, canvas._base, canvas._mask, tintColour(liveryColour));
      railTiles.add(canvas);
      done(null, canvas);
    };
    const load = (u, key) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => { canvas[key] = img; settle(); };
      img.onerror = () => settle();
      img.src = u;
    };

    load(url(RAIL_STYLE_URL), '_base');
    if (hideHistoric) load(url(RAIL_MASK_URL), '_mask');
    return canvas;
  },
  });
  return new TintedRailLayer({
    maxZoom: 19,
    opacity: 0.85,
    attribution: 'Rendering: OpenRailwayMap, Map data: OpenStreetMap contributors',
  });
}

// Re-tinting reuses the images already held on each tile canvas, so a livery
// change costs no network at all - redraw() would refetch every tile from
// OpenRailwayMap, which is both slow and rude to a free tile service.
function retintRailTiles() {
  const colour = tintColour(liveryColour);
  for (const canvas of railTiles) {
    if (!canvas.isConnected) { railTiles.delete(canvas); continue; }
    compositeRailTile(canvas, canvas._base, canvas._mask, colour);
  }
}

function initMap(lat, lon) {
  map = L.map('map', {
    center: [lat, lon],
    zoom: DEFAULT_ZOOM,
    zoomControl: false,
    dragging: false,
    scrollWheelZoom: false,
    doubleClickZoom: false,
    boxZoom: false,
    keyboard: false,
    touchZoom: false,
    attributionControl: true,
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);

  // Real-world rail infrastructure overlay (tracks, platforms, signals,
  // switches) from OpenRailwayMap - built on OSM data, free for
  // non-commercial use. Off by default; toggled on via the button.
  railLayer = makeRailLayer();
  railLayer.on('tileunload', (e) => railTiles.delete(e.tile));

  const icon = L.divIcon({ className: 'player-dot', iconSize: [16, 16] });
  marker = L.marker([lat, lon], { icon }).addTo(map);

  document.getElementById('waiting').style.display = 'none';
  applyLiveryColour();   // the marker exists now
}

// OpenRailwayMap tiles are dark thin lines on transparent, so on a dark
// basemap a straight tint reads as almost black. The hue is kept exactly -
// it is the train's livery - but lightness is floored so a navy or maroon
// livery is still visible. Without this, ScotRail blue on the dark map is
// very nearly invisible.
function tintColour(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec((hex || '').trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  let r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  if (l >= 0.5) return '#' + m[1];
  const k = 0.5 / Math.max(l, 0.001);
  const up = (v) => Math.min(255, Math.round(v * 255 * k));
  return '#' + [up(r), up(g), up(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}

// Applies the livery colour to both the rail lines and the player dot.
// Called on every livery change AND after the map initialises, because
// neither the tile layer nor the marker exists before that - an earlier
// version returned early when the overlay was off, so the filter kept a
// stale colour and the dot was never coloured at all if the first livery
// poll landed before the map was built.
function applyLiveryColour() {
  const c = tintColour(liveryColour);

  retintRailTiles();
  // The glow lifts the thin lines off the basemap; without it a tinted line
  // at this zoom is easy to lose against dark terrain. Applied to the whole
  // layer container rather than per tile, so it does not clip at tile seams.
  if (railLayer && railLayer.getContainer()) {
    railLayer.getContainer().style.filter = c ? `drop-shadow(0 0 2px ${c})` : '';
  }

  const dot = document.querySelector('.player-dot');
  if (dot) {
    dot.style.background = c || '';
    dot.style.boxShadow = c
      ? `0 0 10px ${c}, 0 0 0 6px color-mix(in srgb, ${c} 25%, transparent)`
      : '';
  }
}

function toggleHistoric() {
  hideHistoric = !hideHistoric;
  const btn = document.getElementById('historic-toggle-btn');
  btn.textContent = hideHistoric ? 'Historic Lines: Hidden' : 'Historic Lines: Shown';
  btn.classList.toggle('active', !hideHistoric);
  railTiles.clear();
  if (railLayer && railOverlayOn) railLayer.redraw();   // stencil changed, tiles must refetch
}

async function pollLivery() {
  try {
    const d = await (await fetch('/api/loco')).json();
    const next = d.livery_colour || null;
    if (next !== liveryColour) {
      liveryColour = next;
      // The player dot takes the same colour, so the train and the line it
      // is running on read as one thing.
      applyLiveryColour();
    }
  } catch (e) {
    // leave the last known colour in place
  }
}

function toggleRailOverlay() {
  const btn = document.getElementById('rail-toggle-btn');
  if (!map || !railLayer) return;
  railOverlayOn = !railOverlayOn;
  if (railOverlayOn) {
    railLayer.addTo(map);
    applyLiveryColour();
    btn.textContent = 'Rail Overlay: On';
    btn.classList.add('active');
  } else {
    map.removeLayer(railLayer);
    btn.textContent = 'Rail Overlay: Off';
    btn.classList.remove('active');
  }
}

async function pollLocation() {
  try {
    const res = await fetch('/api/location');
    const data = await res.json();
    if (data.latitude === null || data.longitude === null) return;

    if (!map) {
      initMap(data.latitude, data.longitude);
    } else {
      animateMarkerAndMap(data.latitude, data.longitude);
    }
  } catch (e) {
    // stays on the "waiting" state / keeps last known position until the
    // next successful poll
  }
}

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

function exitApp() {
  fetch('/api/shutdown', {method: 'POST'});
}

initHudControls('hud-controls');
pollLocation();
setInterval(pollLocation, 2000);
pollLivery();
setInterval(pollLivery, 5000);   // livery changes only when the train does
</script>
</body>
</html>
