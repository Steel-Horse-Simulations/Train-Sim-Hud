<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSW HUD - Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pages/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><strong>TSW HUD</strong><br>Setup</div>
    <div class="nav" id="navContainer"></div>
    <button class="exit-btn" onclick="fetch('/api/shutdown',{method:'POST'})">Exit</button>
  </div>
  <main>
    <div class="panel">
      <h2>API Key Folder</h2>
      <div class="field-row">
        <input type="text" id="folderInput" placeholder="Paste folder path here">
        <button class="btn primary" onclick="saveFolder()">Save</button>
      </div>
      <p id="keyStatus" class="small dim">Checking...</p>
    </div>
  </main>
  <script src="/pages/nav.js"></script>
  <script>
    async function saveFolder() {
      const path = document.getElementById('folderInput').value;
      await fetch('/api/config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ config_folder: path })
      });
      checkStatus();
    }
    async function checkStatus() {
      const cfg = await fetch('/api/config').then(r => r.json());
      document.getElementById('folderInput').value = cfg.config_folder || '';
      document.getElementById('keyStatus').textContent = cfg.key_found ? 'Key found.' : 'Key not found.';
    }
    checkStatus();
  </script>
</body>
</html>
