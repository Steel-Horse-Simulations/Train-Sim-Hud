<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TSW Hud - Groups</title>
<link rel="stylesheet" href="/pages/style.css">
<script src="/pages/theme.js"></script>
<style>
  main { max-width: 860px; margin: 0 auto; }
  .back { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  .item-pill {
    background: var(--panel-raised); border: 1px solid var(--hairline); border-radius: 6px;
    margin-bottom: 10px; overflow: hidden;
  }
  .item-header {
    display: flex; align-items: center; gap: 12px; padding: 0 16px; cursor: pointer;
    user-select: none; min-height: 72px;
  }
  .item-header:hover { background: rgba(255,255,255,0.03); }
  .item-name { font-family: var(--heading); font-weight: 600; font-size: 15px; flex: 1; }
  .item-meta { font-size: 12px; color: var(--text-dim); }
  .item-chevron { font-size: 11px; color: var(--text-dim); transition: transform .2s; }
  .item-pill.open .item-chevron { transform: rotate(90deg); }
  .item-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--hairline); }
  .item-pill.open .item-body { display: block; }

  form label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; margin-top: 14px; }
  form label:first-child { margin-top: 0; }
  .field-row { display: flex; gap: 8px; margin-top: 4px; align-items: flex-start; }
  .field-row input { flex: 1; }

  .sub-list { margin-top: 14px; }
  .sub-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--hairline); border-radius: 5px; margin-bottom: 6px; }
  .sub-item .sub-name { flex: 1; font-size: 13px; font-weight: 600; }
  .sub-item .sub-speed { font-size: 12px; color: var(--text-dim); }
  .sub-item .del-btn { background: transparent; border: 1px solid rgba(224,90,78,0.4); color: var(--status-red); padding: 3px 9px; border-radius: 4px; font-size: 11px; cursor: pointer; }
  .sub-item .del-btn:hover { background: rgba(224,90,78,0.15); }

  .add-form { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hairline); }
  .add-form h4 { font-family: var(--heading); font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); margin: 0 0 10px; }
  .btn-row { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .del-group-btn { margin-left: auto; background: transparent; border: 1px solid rgba(224,90,78,0.4); color: var(--status-red); padding: 6px 14px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
  .del-group-btn:hover { background: rgba(224,90,78,0.15); }

  select {
    background: rgba(255,255,255,0.06); border: 1px solid var(--hairline); border-radius: 4px;
    color: var(--text); font-family: var(--sans); font-size: 13px; padding: 6px 8px;
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><strong>TSW Hud</strong> · groups</div>
    <div class="nav" id="navContainer"></div>
    <button class="exit-btn" onclick="exitApp()">Exit</button>
  </div>

  <main>
    <a class="back" href="/pages/classes.html">&larr; Back to Classes</a>
    <div class="titlebar" style="display:flex;align-items:center;gap:12px;margin:10px 0 20px;">
      <h1 style="font-family:var(--heading);font-size:22px;margin:0;">Groups</h1>
    </div>
    <p class="small dim" style="margin-bottom:16px;">
      A Group brings several Classes together as one family — for example Class 801, Class 802
      and Class 805 could all sit inside a "Class 8xx" Group, while each keeps its own subclasses
      (like Class 801/1 and Class 801/2) untouched.
    </p>

    <div id="familiesList"></div>

    <div class="panel" style="margin-top:16px;">
      <h2>Add Group</h2>
      <form onsubmit="createFamily(event)">
        <label>Group name</label>
        <input type="text" id="new-family-name" placeholder="e.g. Class 8xx" style="width:100%;" required>
        <div style="margin-top:14px;">
          <button class="btn primary" type="submit">Add Group</button>
        </div>
      </form>
    </div>
  </main>

<script>
let families = [];
let allClasses = [];

async function load() {
  try {
    const [famRes, classRes] = await Promise.all([
      fetch('/api/known_trains/families'),
      fetch('/api/known_trains/groups'),
    ]);
    const famData = await famRes.json();
    const classData = await classRes.json();
    families = famData.families || [];
    allClasses = classData.groups || [];
    render();
  } catch(e) {
    document.getElementById('familiesList').innerHTML = '<p class="small dim">Could not load groups.</p>';
  }
}

function render() {
  const container = document.getElementById('familiesList');
  if (!families.length) {
    container.innerHTML = '<p class="small dim" style="text-align:center;margin-bottom:16px;">No groups yet — create one below.</p>';
    return;
  }
  container.innerHTML = families.map(f => `
    <div class="item-pill" id="family-pill-${f.id}">
      <div class="item-header" onclick="togglePill('family-pill-${f.id}')">
        <span class="item-name">${esc(f.name)}</span>
        <span class="item-meta">${f.classes.length} class${f.classes.length === 1 ? '' : 'es'}</span>
        <span class="item-chevron">&#9654;</span>
      </div>
      <div class="item-body">
        <form onsubmit="saveFamily(event, ${f.id})">
          <label>Group name</label>
          <input type="text" id="fname-${f.id}" value="${esc(f.name)}" style="width:100%;" required>
          <div class="btn-row">
            <button class="btn primary" type="submit">Save</button>
            <button class="del-group-btn" type="button" onclick="deleteFamily(${f.id}, '${esc(f.name)}')">Delete group</button>
          </div>
        </form>

        <div class="sub-list">
          <h4 style="font-family:var(--heading);font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin:14px 0 10px;">Classes in this group</h4>
          <div id="members-${f.id}">${renderMembers(f)}</div>
        </div>

        <div class="add-form">
          <h4>Add a class to this group</h4>
          <div class="field-row">
            <select id="add-class-${f.id}" style="flex:1;">
              ${unassignedOrOtherClassOptions(f)}
            </select>
            <button class="btn primary" type="button" onclick="addClassToFamily(${f.id})">Add</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function renderMembers(f) {
  if (!f.classes.length) return '<p class="small dim">No classes assigned yet.</p>';
  return f.classes.map(c => `
    <div class="sub-item">
      <span class="sub-name">${esc(c.name)}</span>
      <span class="sub-speed">${c.default_max_speed_mph ? c.default_max_speed_mph + ' mph' : ''}</span>
      <button class="del-btn" onclick="removeClassFromFamily(${c.id}, '${esc(c.name)}', ${f.id})">Remove</button>
    </div>
  `).join('');
}

function unassignedOrOtherClassOptions(f) {
  const memberIds = new Set(f.classes.map(c => c.id));
  const options = allClasses.filter(c => !memberIds.has(c.id));
  if (!options.length) return '<option value="">No other classes available</option>';
  return options.map(c => `<option value="${c.id}">${esc(c.name)}${c.family_id ? ' (in another group)' : ''}</option>`).join('');
}

function togglePill(id) {
  document.getElementById(id).classList.toggle('open');
}

async function saveFamily(e, familyId) {
  e.preventDefault();
  const name = document.getElementById(`fname-${familyId}`).value.trim();
  try {
    await fetch(`/api/known_trains/families/${familyId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name })
    });
    await load();
  } catch(e) { alert('Save failed'); }
}

async function createFamily(e) {
  e.preventDefault();
  const name = document.getElementById('new-family-name').value.trim();
  try {
    await fetch('/api/known_trains/families', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name })
    });
    document.getElementById('new-family-name').value = '';
    await load();
  } catch(e) { alert('Create failed'); }
}

async function deleteFamily(familyId, name) {
  if (!confirm(`Delete group "${name}"? Its classes will not be deleted, just unassigned from this group.`)) return;
  try {
    await fetch(`/api/known_trains/families/${familyId}`, { method: 'DELETE' });
    await load();
  } catch(e) { alert('Delete failed'); }
}

async function addClassToFamily(familyId) {
  const sel = document.getElementById(`add-class-${familyId}`);
  const classId = sel.value;
  if (!classId) return;
  try {
    await fetch(`/api/known_trains/groups/${classId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ family_id: familyId })
    });
    await load();
    document.getElementById(`family-pill-${familyId}`).classList.add('open');
  } catch(e) { alert('Add failed'); }
}

async function removeClassFromFamily(classId, name, familyId) {
  if (!confirm(`Remove "${name}" from this group? The class itself will not be deleted.`)) return;
  try {
    await fetch(`/api/known_trains/groups/${classId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ family_id: null })
    });
    await load();
    document.getElementById(`family-pill-${familyId}`).classList.add('open');
  } catch(e) { alert('Remove failed'); }
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function exitApp() { fetch('/api/shutdown', {method: 'POST'}); }

load();
</script>
<script src="/pages/nav.js"></script>
</body>
</html>
